<body class="pagina-registro">
  <div class="corazones-flotantes">
    <span class="corazon">❤</span><span class="corazon">💕</span><span class="corazon">💖</span>
    <span class="corazon">💝</span><span class="corazon">💗</span><span class="corazon">❤</span>
    <span class="corazon">💕</span><span class="corazon">💖</span>
  </div>
  <div class="galeria-izq"><div class="foto visible"></div><div class="foto"></div><div class="foto"></div></div>
  <div class="galeria-der"><div class="foto visible"></div><div class="foto"></div><div class="foto"></div></div>
  <header>
    <h1>❤ AGENDA PERSONAL REGISTRO ❤</h1>
    <p>💕 Registro Cliente 💕</p>
  </header>

  <nav class="navegacion" aria-label="Navegación principal">
    <a class="boton" href="index.html">Login</a>
  </nav>

  <main>
    <p id="msg-error" class="errores" hidden></p>

    <form id="form-registro">
      <label for="nombre">Nombre</label>
      <input type="text" id="nombre" name="nombre" required>

      <label for="email">Email</label>
      <input type="email" id="email" name="email" required>

      <label for="movil">Móvil</label>
      <input type="text" id="movil" name="movil" required>

      <label for="password">Contraseña</label>
      <input type="password" id="password" name="password" required minlength="6">

      <button type="submit">Crear usuario</button>
    </form>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/supabase-client.js"></script>
  <script src="js/auth.js"></script>
  <script>
    function iniciarGaleria(selector) {
      const fotos = document.querySelectorAll(selector + ' .foto');
      if (fotos.length === 0) return;
      let actual = 0;
      setInterval(() => {
        fotos[actual].classList.remove('visible');
        actual = (actual + 1) % fotos.length;
        fotos[actual].classList.add('visible');
      }, 4000);
    }
    iniciarGaleria('.galeria-izq');
    iniciarGaleria('.galeria-der');

    const form = document.getElementById('form-registro');
    const msgError = document.getElementById('msg-error');

    form.addEventListener('submit', async (e) => {
        e.preventDefault();
        msgError.hidden = true;

        const nombre = document.getElementById('nombre').value.trim();
        const email = document.getElementById('email').value.trim();
        const movil = document.getElementById('movil').value.trim();
        const password = document.getElementById('password').value;

        if (!nombre || !email || !movil || !password) {
            msgError.textContent = 'Todos los campos son obligatorios.';
            msgError.hidden = false;
            return;
        }

        try {
            await registro(nombre, email, movil, password);
            window.location.href = 'agenda.html';
        } catch (err) {
            msgError.textContent = err.message || 'Error al crear el usuario.';
            msgError.hidden = false;
        }
    });
  </script>
