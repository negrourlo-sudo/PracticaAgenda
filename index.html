<body class="pagina-login">
  <div class="corazones-flotantes">
    <span class="corazon">❤</span><span class="corazon">💕</span><span class="corazon">💖</span>
    <span class="corazon">💝</span><span class="corazon">💗</span><span class="corazon">❤</span>
    <span class="corazon">💕</span><span class="corazon">💖</span>
  </div>
  <div class="galeria-izq"><div class="foto visible"></div><div class="foto"></div><div class="foto"></div></div>
  <div class="galeria-der"><div class="foto visible"></div><div class="foto"></div><div class="foto"></div></div>
  <header>
    <h1>❤ AGENDA PERSONAL ACCESO ❤</h1>
    <p>💕 Acceso Cliente 💕</p>
  </header>

  <main>
    <p id="msg-exito" class="exito" hidden></p>
    <p id="msg-error" class="errores" hidden></p>

    <div class="acciones-login">
      <form id="form-login">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" required>

        <label for="password">Contraseña</label>
        <input type="password" id="password" name="password" required>

        <button type="submit">Entrar</button>
      </form>

      <a class="boton boton-registro" href="registro.html">Registrarse</a>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/supabase-client.js"></script>
  <script src="js/auth.js"></script>
  <script>
    function iniciarGaleria(selector) {
      const fotos = document.querySelectorAll(selector + ' .foto');
      if (fotos.length === 0) return;
      let actual = 0;
      setInterval(() => {
        fotos[actual].classList.remove('visible');
        actual = (actual + 1) % fotos.length;
        fotos[actual].classList.add('visible');
      }, 4000);
    }
    iniciarGaleria('.galeria-izq');
    iniciarGaleria('.galeria-der');

    const form = document.getElementById('form-login');
    const msgError = document.getElementById('msg-error');
    const msgExito = document.getElementById('msg-exito');

    getSesion().then(session => {
        if (session) window.location.href = 'agenda.html';
    });

    form.addEventListener('submit', async (e) => {
        e.preventDefault();
        msgError.hidden = true;
        msgExito.hidden = true;

        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;

        try {
            await login(email, password);
            window.location.href = 'agenda.html';
        } catch (err) {
            msgError.textContent = err.message || 'Email o contraseña incorrectos.';
            msgError.hidden = false;
        }
    });
  </script>
